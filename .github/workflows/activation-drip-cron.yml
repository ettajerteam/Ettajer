name: Merchant activation drip

# Daily — avoids consuming a Vercel Hobby cron slot (see channel-sync-cron.yml).
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  drip:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger activation drip
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://www.ettajer.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/activation-drip"
